description: Allegiance Telecom was a competitive local exchange carrier (CLEC) founded in 1997 and backed
  by Battery Ventures, providing local and long-distance voice, data, and internet services to business
  customers across major U.S. metropolitan markets. The company went public in 1998, expanded rapidly during
  the telecom boom, then filed for Chapter 11 bankruptcy in 2003; its network assets were acquired by XO
  Communications. Allegiance Telecom is defunct and operates no website, developer program, or public API
  surface today. This profile was surfaced from the Battery Ventures portfolio graph and is retained as an
  historical company record in the API Evangelist network. Enrichment found no live API artifacts to harvest.
